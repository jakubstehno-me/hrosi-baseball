<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baseball">
<meta name="theme-color" content="#1a3a6b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>⚾ Hroši Brno</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Hippos blue → Hroši navy */
  --hippos:#3d8ef0;
  --hrosi:#0d1b2e;
  --navy:#1a3a6b;
  --navy-light:#234d8a;
  --blue-mid:#2a6abf;
  --sky:#e8f2ff;
  --sky2:#d0e4ff;
  --white:#ffffff;
  --off-white:#f0f4fa;
  --text:#1a2a4a;
  --text2:#4a6080;
  --text3:#8aa0bc;
  --green:#22c55e;
  --green-dark:#16a34a;
  --red:#ef4444;
  --orange:#f97316;
  --yellow:#fbbf24;
  --purple:#8b5cf6;
  --card-bg:#ffffff;
  --card-border:#dde8f7;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
}
html{
  height:100%;height:-webkit-fill-available;
  background:var(--off-white);
}
body{
  min-height:100vh;min-height:-webkit-fill-available;min-height:100dvh;
  background:var(--off-white);color:var(--text);font-family:'Nunito Sans',sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  /* iOS fix: position:fixed fills viewport correctly */
  position:fixed;width:100%;top:0;left:0;right:0;bottom:0;
  padding-top:var(--sat);padding-left:var(--sal);padding-right:var(--sar);
}

/* ══ HEADER ══ */
.hdr{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);
  padding:12px 18px 10px;display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;position:relative;overflow:hidden;
}
.hdr::after{content:'⚾';position:absolute;right:-10px;top:-10px;font-size:5rem;opacity:.06;pointer-events:none}
.hdr-left{display:flex;align-items:center;gap:10px}
.avatar{
  width:42px;height:42px;border-radius:50%;
  background:var(--hippos);border:3px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;
  font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:900;
  color:white;flex-shrink:0;cursor:pointer;
}
.hdr-name{font-family:'Nunito',sans-serif;font-weight:900;font-size:1rem;color:white;line-height:1.1}
.hdr-team{font-size:.65rem;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.08em}
.hdr-right{display:flex;align-items:center;gap:10px}
.stat-pill{
  background:rgba(255,255,255,.15);border-radius:20px;
  padding:4px 10px;display:flex;align-items:center;gap:5px;
  font-family:'Nunito',sans-serif;font-weight:800;font-size:.85rem;color:white;
}
.stat-pill .ic{font-size:.9rem}
.sound-btn{
  width:32px;height:32px;border-radius:50%;border:none;
  background:rgba(255,255,255,.15);color:white;font-size:.9rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}

/* ══ TAB BAR ══ */
.tabs{
  display:flex;background:white;
  border-bottom:2px solid var(--sky2);
  flex-shrink:0;
}
.tab-btn{
  flex:1;padding:9px 4px 7px;text-align:center;cursor:pointer;
  border:none;background:none;-webkit-tap-highlight-color:transparent;
  transition:all .15s;
}
.tab-btn .tab-ic{font-size:1.2rem;display:block;margin-bottom:2px}
.tab-btn .tab-lb{font-size:.62rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.tab-btn.active .tab-lb{color:var(--hippos)}
.tab-btn.active{border-bottom:2px solid var(--hippos);margin-bottom:-2px}

/* ══ SCROLL ══ */
.scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  min-height:0;
  /* iOS Safari scroll fix */
  overscroll-behavior:contain;
  padding:16px 16px calc(20px + var(--sab));
}
.page{display:none}.page.active{display:block}

/* ══ SHARED ══ */
.card{background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:16px;margin-bottom:12px;overflow:hidden;
  box-shadow:0 2px 8px rgba(26,58,107,.06)}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 20px;border-radius:14px;border:none;cursor:pointer;
  font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;
  -webkit-tap-highlight-color:transparent;-webkit-appearance:none;
  transition:transform .1s, box-shadow .1s;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--hippos),#2a6abf);color:white}
.btn-green{background:linear-gradient(135deg,var(--green),var(--green-dark));color:white}
.btn-ghost{background:var(--sky);color:var(--navy);box-shadow:none;border:1px solid var(--sky2)}
.btn-w{width:100%}
.section-title{
  font-family:'Nunito',sans-serif;font-weight:900;font-size:.8rem;
  text-transform:uppercase;letter-spacing:.1em;color:var(--text3);
  margin:20px 0 8px;
}
.section-title:first-child{margin-top:0}

/* ══ ONBOARDING ══ */
#ob{
  position:fixed;inset:0;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-light) 60%,var(--hippos) 100%);
  z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 28px;padding-top:calc(40px + var(--sat));padding-bottom:calc(40px + var(--sab));
}
.ob-logo{font-size:5rem;margin-bottom:8px;text-align:center;animation:bounce 1s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ob-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:2.2rem;color:white;text-align:center;margin-bottom:4px}
.ob-sub{font-size:.9rem;color:rgba(255,255,255,.7);text-align:center;margin-bottom:32px}
.ob-field{width:100%;max-width:340px;margin-bottom:14px}
.ob-lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.7);margin-bottom:6px}
.ob-in{
  width:100%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.25);
  border-radius:12px;padding:14px 16px;font-size:1.1rem;font-family:'Nunito Sans',sans-serif;
  color:white;-webkit-appearance:none;outline:none;transition:border-color .15s;
  font-weight:700;
}
.ob-in:focus{border-color:rgba(255,255,255,.7)}
.ob-in::placeholder{color:rgba(255,255,255,.4)}
.ob-cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;width:100%;max-width:340px}
.ob-cat{
  padding:10px 4px;border-radius:10px;border:2px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);color:white;font-family:'Nunito',sans-serif;
  font-weight:800;font-size:.82rem;text-align:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:all .15s;
}
.ob-cat.sel{background:var(--hippos);border-color:var(--hippos)}

/* ══ SETTINGS ══ */
#set-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
  display:none;align-items:flex-end;justify-content:center}
#set-ov.show{display:flex}
.set-sh{
  background:var(--off-white);border-radius:20px 20px 0 0;
  padding:20px 20px calc(20px + var(--sab));width:100%;max-width:520px;
  max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.set-handle{width:40px;height:4px;background:var(--text3);border-radius:2px;margin:0 auto 16px;opacity:.5}
.set-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.2rem;color:var(--text);margin-bottom:16px}

/* ══ HOME / DAILY ══ */
.daily-header{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);
  border-radius:16px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden;
}
.daily-header::after{content:'⚾';position:absolute;right:-8px;bottom:-12px;font-size:4.5rem;opacity:.1}
.dh-greeting{font-size:.75rem;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.dh-name{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.6rem;color:white;margin-bottom:10px}
.dh-progress-wrap{margin-bottom:6px}
.dh-prog-label{display:flex;justify-content:space-between;font-size:.72rem;color:rgba(255,255,255,.7);font-weight:700;margin-bottom:5px}
.dh-prog-bar{height:10px;background:rgba(255,255,255,.2);border-radius:5px;overflow:hidden}
.dh-prog-fill{height:100%;background:linear-gradient(90deg,#fbbf24,#f97316);border-radius:5px;transition:width .6s cubic-bezier(.34,1.56,.64,1)}
.dh-done{font-size:.75rem;color:rgba(255,255,255,.6);font-weight:600}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat-card{background:white;border:1px solid var(--card-border);border-radius:14px;padding:12px;text-align:center;box-shadow:0 2px 6px rgba(26,58,107,.05)}
.stat-val{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.6rem;line-height:1}
.stat-lbl{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-top:2px}

/* Daily tasks */
.task-card{
  background:white;border:2px solid var(--card-border);border-radius:16px;
  padding:16px;margin-bottom:10px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:all .15s;
  box-shadow:0 2px 8px rgba(26,58,107,.06);
  display:flex;align-items:center;gap:14px;
}
.task-card:active{transform:scale(.98)}
.task-card.done{background:var(--sky);border-color:var(--hippos)}
.task-card.locked{opacity:.5;cursor:default}
.task-ic{
  width:52px;height:52px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;flex-shrink:0;
}
.task-body{flex:1}
.task-cat{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:2px}
.task-name{font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;color:var(--text);line-height:1.2}
.task-time{font-size:.72rem;color:var(--text3);font-weight:600;margin-top:2px}
.task-right{flex-shrink:0}
.task-check{
  width:32px;height:32px;border-radius:50%;border:3px solid var(--card-border);
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  transition:all .2s;
}
.task-card.done .task-check{background:var(--hippos);border-color:var(--hippos);color:white}

/* Unlock bonus */
.bonus-unlock{
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  border-radius:16px;padding:16px;margin-bottom:12px;
  display:flex;align-items:center;gap:14px;
  box-shadow:0 4px 14px rgba(124,58,237,.3);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.bonus-unlock.locked{opacity:.4;cursor:default;filter:grayscale(.5)}
.bonus-ic{font-size:2rem;flex-shrink:0}
.bonus-text .bonus-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.7)}
.bonus-text .bonus-name{font-family:'Nunito',sans-serif;font-weight:900;font-size:1rem;color:white}
.bonus-text .bonus-hint{font-size:.72rem;color:rgba(255,255,255,.6);margin-top:1px}

/* Inning calendar */
.cal-card{background:white;border:1px solid var(--card-border);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(26,58,107,.05)}
.cal-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:.9rem;color:var(--text);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.cal-month{font-size:.72rem;font-weight:700;color:var(--text3)}
.cal-hdrs{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-hdr{font-size:.55rem;font-weight:800;text-align:center;color:var(--text3);text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.cal-day .cdn{font-size:.65rem;font-weight:700;color:var(--text3)}
.cal-day.empty{opacity:0;pointer-events:none}
.cal-day.training .cdn{color:var(--hippos)}
.cal-day.training{background:var(--sky)}
.cal-day.done{background:var(--hippos)}
.cal-day.done .cdn{color:white}
.cal-day.today{outline:2px solid var(--orange);outline-offset:-1px}
.cal-day.today .cdn{font-weight:900}

/* ══ QUIZ PAGE ══ */
.quiz-start{text-align:center;padding:20px 0}
.quiz-hero-emoji{font-size:4rem;margin-bottom:10px;display:block}
.quiz-hero-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.6rem;color:var(--text);margin-bottom:6px}
.quiz-hero-sub{font-size:.85rem;color:var(--text2);margin-bottom:24px;line-height:1.5}
.quiz-cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.quiz-cat-btn{
  padding:16px 10px;border-radius:14px;border:2px solid var(--card-border);
  background:white;cursor:pointer;text-align:center;
  -webkit-tap-highlight-color:transparent;-webkit-appearance:none;
  transition:all .15s;box-shadow:0 2px 6px rgba(26,58,107,.05);
}
.quiz-cat-btn:active{transform:scale(.97)}
.quiz-cat-ic{font-size:1.8rem;margin-bottom:4px}
.quiz-cat-nm{font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;color:var(--text)}
.quiz-cat-ct{font-size:.68rem;font-weight:600;color:var(--text3)}

/* Quiz active */
.quiz-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.quiz-hearts{display:flex;gap:3px;font-size:1.3rem}
.quiz-prog-wrap{flex:1}
.quiz-prog-bar{height:10px;background:var(--sky2);border-radius:5px;overflow:hidden}
.quiz-prog-fill{height:100%;background:linear-gradient(90deg,var(--hippos),var(--navy));border-radius:5px;transition:width .3s}
.quiz-prog-lbl{font-size:.62rem;font-weight:700;color:var(--text3);text-align:right;margin-top:2px}
.quiz-streak{font-family:'Nunito',sans-serif;font-weight:900;font-size:.9rem;color:var(--orange);background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:3px 8px;flex-shrink:0}

.qcard{background:white;border:2px solid var(--card-border);border-radius:20px;padding:20px;margin-bottom:12px;box-shadow:0 4px 16px rgba(26,58,107,.08)}
.qcard-type{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:8px}
.qcard-q{font-family:'Nunito',sans-serif;font-weight:800;font-size:1.2rem;color:var(--text);line-height:1.3;margin-bottom:12px}
.qcard-diag{display:flex;justify-content:center;margin-bottom:12px}
.qcard-diag svg{max-width:200px;width:100%}
.qcard-term{background:var(--sky);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:.78rem;color:var(--navy);line-height:1.4;font-weight:600}
.qcard-term strong{color:var(--hippos)}

.mc-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mc-opt{
  padding:14px 10px;border-radius:12px;border:2.5px solid var(--card-border);
  background:white;color:var(--text);font-family:'Nunito',sans-serif;font-weight:700;font-size:.9rem;
  cursor:pointer;text-align:center;transition:all .15s;
  -webkit-tap-highlight-color:transparent;-webkit-appearance:none;line-height:1.3;
  box-shadow:0 2px 6px rgba(26,58,107,.05);
}
.mc-opt:active{transform:scale(.97)}
.mc-opt.correct{background:#dcfce7;border-color:var(--green);color:var(--green-dark)}
.mc-opt.wrong{background:#fee2e2;border-color:var(--red);color:#dc2626}
.mc-opt:disabled{cursor:default;transform:none}

.fc-reveal-btn{
  width:100%;padding:14px;border-radius:12px;border:2.5px dashed var(--hippos);
  background:var(--sky);color:var(--hippos);font-family:'Nunito',sans-serif;font-weight:800;
  font-size:.95rem;cursor:pointer;-webkit-appearance:none;margin-bottom:10px;
}
.fc-ans{display:none;background:var(--sky);border-radius:12px;padding:14px;margin-bottom:10px;
  font-size:.9rem;font-weight:600;color:var(--text);line-height:1.5}
.fc-ans.show{display:block}
.fc-rate{display:none;gap:8px}
.fc-rate-btn{flex:1;padding:12px;border-radius:12px;border:none;font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;cursor:pointer;-webkit-appearance:none}
.fc-rate-yes{background:#dcfce7;color:var(--green-dark)}
.fc-rate-no{background:#fee2e2;color:#dc2626}

.quiz-fb{border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:.85rem;font-weight:600;line-height:1.5;display:none}
.quiz-fb.show{display:block}
.quiz-fb.ok{background:#dcfce7;border:1.5px solid #86efac;color:var(--green-dark)}
.quiz-fb.err{background:#fee2e2;border:1.5px solid #fca5a5;color:#dc2626}
.quiz-xp-pop{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.1rem;color:var(--yellow);text-align:center;margin-bottom:6px;display:none}
.quiz-xp-pop.show{display:block}

.quiz-end{text-align:center;padding:24px 10px}
.qe-em{font-size:4rem;margin-bottom:8px;display:block}
.qe-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.8rem;color:var(--text);margin-bottom:4px}
.qe-sub{font-size:.9rem;color:var(--text2);margin-bottom:16px}
.qe-score{font-family:'Nunito',sans-serif;font-weight:900;font-size:2.8rem;color:var(--hippos);margin-bottom:20px}

/* ══ BASICS ══ */
.bc-card{
  background:white;border:1px solid var(--card-border);border-radius:16px;
  margin-bottom:10px;overflow:hidden;cursor:pointer;
  -webkit-tap-highlight-color:transparent;box-shadow:0 2px 6px rgba(26,58,107,.05);
}
.bc-head{padding:14px 16px;display:flex;align-items:center;gap:12px}
.bc-emoji{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.bc-info{flex:1}
.bc-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:.95rem;color:var(--text);margin-bottom:1px}
.bc-sub{font-size:.7rem;font-weight:600;color:var(--text3)}
.bc-lv{font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0}
.bc-lv-1{background:#dbeafe;color:#1d4ed8}
.bc-lv-2{background:#d1fae5;color:#065f46}
.bc-lv-3{background:#f3e8ff;color:#7e22ce}
.bc-tog{font-size:.8rem;color:var(--text3);transition:transform .2s;flex-shrink:0;margin-left:6px}
.bc-tog.open{transform:rotate(180deg)}
.bc-body{display:none;border-top:1px solid var(--sky2)}
.bc-body.show{display:block}
.bc-inner{padding:14px 16px}
.bc-p{font-size:.88rem;line-height:1.65;color:var(--text);margin-bottom:8px}
.bc-p strong{color:var(--hippos);font-weight:700}
.bc-p:last-child{margin-bottom:0}
.bc-steps{margin-bottom:8px}
.bc-step{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.bc-snum{
  width:26px;height:26px;border-radius:50%;background:var(--hippos);color:white;
  font-family:'Nunito',sans-serif;font-weight:900;font-size:.85rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;
}
.bc-stext{font-size:.85rem;line-height:1.55;color:var(--text)}
.bc-stext strong{color:var(--hippos);font-weight:700}
.bc-list{list-style:none;margin-bottom:8px}
.bc-list li{font-size:.85rem;line-height:1.55;color:var(--text);
  padding:5px 0 5px 18px;position:relative;border-bottom:1px solid var(--sky2)}
.bc-list li:last-child{border-bottom:none}
.bc-list li::before{content:'→';position:absolute;left:0;color:var(--hippos);font-weight:700}

<script>
// ═══════════════════════════════════
// STORAGE
// ═══════════════════════════════════
const S={
  get(k,d=null){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
const today=()=>new Date().toISOString().slice(0,10);

// ═══════════════════════════════════
// PROFILE
// ═══════════════════════════════════
const DEF={name:'',number:'27',category:'U8',xp:0,runs:0,
  trainingDays:[1,3,5],dayConfig:{},soundOn:true,ttsOn:false};
function getP(){return Object.assign({},DEF,S.get('prof',{}))}
function saveP(p){S.set('prof',p);updateHdr()}
function addRuns(n){const p=getP();p.runs=(p.runs||0)+n;saveP(p)}

// ═══════════════════════════════════
// STREAK
// ═══════════════════════════════════
function getStr(){return S.get('str',{count:0,lastDate:'',days:[]})}
function recordDay(){
  const t=today(),s=getStr();
  if(s.lastDate===t)return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  s.count=s.lastDate===y?s.count+1:1;
  s.lastDate=t;s.days=s.days||[];
  if(!s.days.includes(t))s.days.push(t);
  if(s.days.length>90)s.days=s.days.slice(-90);
  S.set('str',s);updateHdr();
}

// ═══════════════════════════════════
// SOUND & TTS
// ═══════════════════════════════════
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null;
function getAC(){if(!ac&&AC)try{ac=new AC()}catch(e){}return ac}
function playTone(freq,dur,type='sine',vol=.3){
  const a=getAC();if(!a||!getP().soundOn)return;
  try{
    const o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
    o.start();o.stop(a.currentTime+dur);
  }catch(e){}
}
function soundCorrect(){
  playTone(523,.1,'sine',.25);
  setTimeout(()=>playTone(659,.1,'sine',.25),100);
  setTimeout(()=>playTone(784,.2,'sine',.25),200);
}
function soundWrong(){playTone(200,.3,'sawtooth',.2)}
function soundComplete(){
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,.15,'sine',.2),i*120));
}
function soundTap(){playTone(440,.06,'sine',.15)}
function toggleSound(){
  const p=getP();p.soundOn=!p.soundOn;saveP(p);
  document.getElementById('sound-btn').textContent=p.soundOn?'🔊':'🔇';
}
function setSoundPref(v){
  const p=getP();p.soundOn=v==='on';saveP(p);
  document.getElementById('sound-btn').textContent=p.soundOn?'🔊':'🔇';
  updateSetBtns();
}
function setTtsPref(v){const p=getP();p.ttsOn=v==='on';saveP(p);updateSetBtns()}
function speak(txt){
  const p=getP();if(!p.ttsOn||!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='cs-CZ';u.rate=.95;u.pitch=1.1;
  window.speechSynthesis.speak(u);
}

// ═══════════════════════════════════
// DAILY TASKS
// ═══════════════════════════════════
const DAILY_POOL = [
  // TEORIE
  {id:'q-basics',type:'theory',emoji:'🧠',cat:'Teorie',name:'Dnešní pravidlo',time:'2 min',color:'#dbeafe',action:()=>showTab('quiz')},
  // ATLETIKA
  {id:'ath-jump',type:'athletic',emoji:'🦘',cat:'Atletika',name:'5× přeskočit čáru',time:'2 min',
   steps:['Stoupni si bokem k čáře (linka na zemi, provaz...)','5× přeskákej oběma nohama tam a zpět','Pak 5× na jedné noze – levá, pak pravá','Každý skok rovně – kolena trochu pokrčená']},
  {id:'ath-run',type:'athletic',emoji:'🏃',cat:'Atletika',name:'Starty a akcelerace',time:'2 min',
   steps:['Naklop se dopředu jako závodní auto na startu','Na signál (nebo si řekni "teď!") – exploduj vpřed','Udělej 5 krátkých výbušných startů na 10 metrů','Chvíli odpočiň a opakuj']},
  {id:'ath-balance',type:'athletic',emoji:'🧘',cat:'Atletika',name:'Rovnováha na jedné noze',time:'1 min',
   steps:['Stůj na jedné noze – zkus 30 sekund','Zavři oči – je to těžší!','Zkus druhou nohu','Bonus: stůj na jedné noze a chytej míč']},
  // HÁZENÍ
  {id:'throw-wall',type:'throwing',emoji:'⚾',cat:'Házení',name:'50× hodit ke zdi',time:'3 min',
   steps:['Grip: 2 prsty přes švy, palec dole','Stůj bokem ke zdi, vzdálenost 3-5 m','Hod: krok vpřed + rotace boků + švih','Chyť odraz a opakuj – 50× pomalu a správně']},
  {id:'throw-aim',type:'throwing',emoji:'🎯',cat:'Házení',name:'Hod na cíl',time:'3 min',
   steps:['Nakresli křídou nebo přilep papír na zeď – terč','Vzdálenost: 5 metrů','Hoď 20× – počítej zásahy','Každý hod: krok, rotace, švih, follow-through']},
  // PÁLENÍ
  {id:'bat-shadow',type:'batting',emoji:'🏏',cat:'Pálení',name:'Stínové švihy',time:'2 min',
   steps:['Vezmi pálku nebo klacek/deštník','Postoj: bokem, nohy na šíři ramen, kolena pokrčena','Udělej 20 pomalých švihu – soustřeď se na pohyb','Pořadí: BOKY → RAMENA → PÁLKA']},
  {id:'bat-tee',type:'batting',emoji:'🏏',cat:'Pálení',name:'20× odpal z tee',time:'3 min',
   steps:['Nastav tee (nebo polož míč na kužel/sklenici)','Postoj: dominantní oko dál od míče','Pohled na míč AŽ do kontaktu','20 odpalů – po každém si řekni co bylo dobře']},
  // CHYTÁNÍ
  {id:'catch-wall',type:'catching',emoji:'🧤',cat:'Chytání',name:'Chytání u zdi',time:'3 min',
   steps:['Stůj 3 m od zdi, rukavice nasazená','Hoď míč o zeď – různě vysoko, nízko, do strany','Chyť oběma rukama – nejdřív rukavice, pak zavři','30× – střídej pravou a levou stranu']},
  {id:'catch-hop',type:'catching',emoji:'👀',cat:'Postřeh',name:'Hra "Hop!"',time:'2 min',
   steps:['Potřebuješ kamaráda nebo tátu','Jeden stojí zády, druhý hodí míč nahoru a zakřičí HOP!','Otočíš se a chytáš!','Kdo víc chytí za 2 minuty?']},
  // MENTÁLNÍ
  {id:'mental-breath',type:'mental',emoji:'🧘',cat:'Mentální',name:'Baseballový dech',time:'1 min',
   steps:['Sednout si nebo stoupnout rovně','Nádech nosem – pomalu 4 vteřiny','Zadrž dech – 2 vteřiny','Výdech ústy – pomalu 6 vteřin','Opakuj 5×. Tohle dělají profi hráči před zápasen!']},
  {id:'mental-viz',type:'mental',emoji:'🎬',cat:'Mentální',name:'Vizualizace odpalu',time:'2 min',
   steps:['Zavři oči','Představ si: stojíš u pálky, vidíš míč jak letí','Vidíš jak švihneš – KONTAKT – míč letí daleko!','3× si to přehraj v hlavě','Pak otevři oči a pocit si pamatuj na hřišti']},
  // VÝBAVA
  {id:'gear-pack',type:'gear',emoji:'🎒',cat:'Výbava',name:'Sbalit si na trénink',time:'1 min',
   steps:['Helma ✓','Rukavice (glove) ✓','Kšiltovka (cap) ✓','Pití – plná lahev ✓','Spiky / turfy ✓','Zkontroluj batoh 2× – co chybí?']},
];

function getTodayTasks(){
  // Rotate daily tasks based on day of year - 3 core + bonus
  const doy=Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/864e5);
  const pool=[...DAILY_POOL];
  // Always include 1 theory, 1 physical, 1 gear/mental
  const theory=pool.filter(t=>t.type==='theory');
  const physical=pool.filter(t=>['athletic','throwing','batting','catching'].includes(t.type));
  const soft=pool.filter(t=>['mental','gear'].includes(t.type));
  const pick=(arr,offset)=>arr[Math.abs(doy+offset)%arr.length];
  return [pick(theory,0),pick(physical,1),pick(soft,2)];
}

function getTodayBonus(){
  const doy=Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/864e5);
  const extras=DAILY_POOL.filter(t=>!['theory','gear'].includes(t.type));
  return extras[doy%extras.length];
}

function getDoneToday(){return S.get('done-'+today(),{})}
function setDoneToday(id){const d=getDoneToday();d[id]=true;S.set('done-'+today(),d)}

// ═══════════════════════════════════
// HEADER
// ═══════════════════════════════════
function updateHdr(){
  const p=getP(),st=getStr();
  document.getElementById('hdr-av').textContent=(p.name||'?')[0].toUpperCase();
  document.getElementById('hdr-name').textContent=p.name||'Hráč';
  document.getElementById('hdr-team').textContent=`Hippos · ${p.category||'U8'}`;
  document.getElementById('hdr-streak').textContent=st.count;
  document.getElementById('hdr-runs').textContent=p.runs||0;
  document.getElementById('sound-btn').textContent=p.soundOn?'🔊':'🔇';
}

// ═══════════════════════════════════
// INIT
// ═══════════════════════════════════
function init(){
  const p=getP();
  if(!p.name||!S.get('ob-done')){
    document.getElementById('ob').style.display='flex';
    document.getElementById('app').style.display='none';
  } else startApp();
}

document.getElementById('ob-cats').addEventListener('click',e=>{
  if(e.target.classList.contains('ob-cat')){
    document.querySelectorAll('#ob-cats .ob-cat').forEach(b=>b.classList.remove('sel'));
    e.target.classList.add('sel');
  }
});

function obDone(){
  const name=document.getElementById('ob-name').value.trim()||'Hráč';
  const num=document.getElementById('ob-num').value.trim()||'27';
  const cat=document.querySelector('#ob-cats .ob-cat.sel')?.dataset.c||'U8';
  const p=getP();p.name=name;p.number=num;p.category=cat;
  saveP(p);S.set('ob-done',true);
  document.getElementById('ob').style.display='none';
  startApp();
}

function startApp(){
  document.getElementById('app').style.cssText='display:flex;flex-direction:column;height:100%;overflow:hidden;min-height:0';
  updateHdr();
  renderHome();renderBasics();renderActivity();renderQuizStart();
}

// ═══════════════════════════════════
// TABS
// ═══════════════════════════════════
function showTab(n){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+n).classList.add('active');
  document.getElementById('tab-'+n).classList.add('active');
  document.getElementById('ms').scrollTop=0;
  soundTap();
  if(n==='home')renderHome();
}

// ═══════════════════════════════════
// SETTINGS
// ═══════════════════════════════════
const DAY_NAMES=['Ne','Po','Út','St','Čt','Pá','So'];
const DAY_ORDER=[[1,'Po'],[2,'Út'],[3,'St'],[4,'Čt'],[5,'Pá'],[6,'So'],[0,'Ne']];
const CATS=['U6','U8','U10','U12','U14','U16'];

function setOpen(){
  const p=getP();
  document.getElementById('s-name').value=p.name||'';
  document.getElementById('s-num').value=p.number||'';
  const days=p.trainingDays||[1,3,5];
  // cats
  document.getElementById('s-cats').innerHTML=CATS.map(c=>
    `<button class="ob-cat${c===p.category?' sel':''}" data-c="${c}" onclick="selCat(this,'s-cats')">${c}</button>`
  ).join('');
  // days
  document.getElementById('s-days').innerHTML=DAY_ORDER.map(([d,l])=>
    `<button style="padding:6px 2px;border-radius:6px;border:1.5px solid var(--sky2);background:${days.includes(d)?'var(--hippos)':'var(--sky)'};color:${days.includes(d)?'white':'var(--text3)'};font-family:'Nunito',sans-serif;font-weight:800;font-size:.68rem;cursor:pointer;-webkit-tap-highlight-color:transparent" data-d="${d}" onclick="toggleDayBtn(this)">${l}</button>`
  ).join('');
  renderDayDetails(days,p.dayConfig||{});
  updateSetBtns();
  document.getElementById('set-ov').classList.add('show');
}
function selCat(btn,container){
  document.querySelectorAll('#'+container+' .ob-cat').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}
function toggleDayBtn(btn){
  const isOn=btn.style.background.includes('hippos')||btn.dataset.on==='1';
  btn.style.background=isOn?'var(--sky)':'var(--hippos)';

// HOME / DAILY
// ═══════════════════════════════════
function renderHome(){
  const p=getP(),st=getStr();
  const tasks=getTodayTasks();
  const bonus=getTodayBonus();
  const done=getDoneToday();
  const doneCount=tasks.filter(t=>done[t.id]).length;
  const allDone=doneCount>=tasks.length;
  if(allDone)recordDay();

  // Calendar
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const firstDay=new Date(y,m,1),lastDay=new Date(y,m+1,0);
  const firstDow=firstDay.getDay();
  const offset=firstDow===0?6:firstDow-1;
  const stDays=new Set(st.days||[]);
  const trainDays=p.trainingDays||[1,3,5];

  let calHtml='';
  for(let i=0;i<offset;i++) calHtml+=`<div class="cal-day empty"><div class="cdn"></div></div>`;
  for(let d=1;d<=lastDay.getDate();d++){
    const dd=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow=new Date(y,m,d).getDay();
    const isTrain=trainDays.includes(dow);
    const isDone=stDays.has(dd);
    const isToday=dd===today();
    calHtml+=`<div class="cal-day${isTrain?' training':''}${isDone?' done':''}${isToday?' today':''}">
      <div class="cdn">${d}</div></div>`;
  }

  // Next training
  const nxt=nextTraining(p);

  const greetings=['Ahoj','Čau','Hey','Nazdar'];
  const greet=greetings[new Date().getHours()%greetings.length];

  let html=`
    <div class="daily-header">
      <div class="dh-greeting">${greet}, ${p.name||'hráči'}! 👋</div>
      <div class="dh-name">#${p.number} Dnešní trénink</div>
      <div class="dh-progress-wrap">
        <div class="dh-prog-label">
          <span>Splněno ${doneCount}/${tasks.length}</span>
          <span>${allDone?'🏆 Perfektní!':''}</span>
        </div>
        <div class="dh-prog-bar"><div class="dh-prog-fill" style="width:${(doneCount/tasks.length)*100}%"></div></div>
      </div>
    </div>`;

  // Stats
  html+=`<div class="stats-row">
    <div class="stat-card"><div class="stat-val" style="color:var(--orange)">${st.count}🔥</div><div class="stat-lbl">Dní v řadě</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--hippos)">${p.runs||0}</div><div class="stat-lbl">Body (runs)</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--purple)">${Math.floor((p.runs||0)/10)}</div><div class="stat-lbl">Level</div></div>
  </div>`;

  // Next training card
  if(nxt){
    html+=`<div style="background:var(--sky);border:1.5px solid var(--sky2);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px">
      <span style="font-size:1.6rem">🏟️</span>
      <div><div style="font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3)">Příští trénink</div>
        <div style="font-family:'Nunito',sans-serif;font-weight:800;font-size:.95rem;color:var(--navy)">${nxt.label}</div>
        <div style="font-size:.72rem;font-weight:600;color:var(--text2)">${nxt.time?nxt.time+' · ':''}${nxt.place||'Hřiště'}</div>
      </div>
    </div>`;
  }

  // Daily tasks
  html+=`<div class="section-title">Dnešní úkoly</div>`;
  tasks.forEach((task,i)=>{
    const isDone=done[task.id];
    html+=`<div class="task-card${isDone?' done':''}" onclick="doTask('${task.id}','${task.type}')">
      <div class="task-ic" style="background:${task.color||'var(--sky)'}">
        ${task.emoji}
      </div>
      <div class="task-body">
        <div class="task-cat">${task.cat}</div>
        <div class="task-name">${task.name}</div>
        <div class="task-time">⏱ ${task.time}</div>
      </div>
      <div class="task-right">
        <div class="task-check">${isDone?'✓':''}</div>
      </div>
    </div>`;
  });

  // Bonus
  html+=`<div class="bonus-unlock${allDone?'':' locked'}" onclick="${allDone?`doBonus('${bonus.id}')`:''}">
    <div class="bonus-ic">${bonus.emoji}</div>
    <div class="bonus-text">
      <div class="bonus-label">${allDone?'🔓 Bonus odemčen!':'🔒 Splň úkoly pro bonus'}</div>
      <div class="bonus-name">${bonus.name}</div>
      <div class="bonus-hint">${allDone?'Klikni a hraj!':'Dokonči všechny 3 úkoly'}</div>
    </div>
  </div>`;

  // Calendar
  html+=`<div class="cal-card">
    <div class="cal-title">
      ${now.toLocaleString('cs-CZ',{month:'long'})}
      <span class="cal-month">${y}</span>
    </div>
    <div class="cal-hdrs">${['Po','Út','St','Čt','Pá','So','Ne'].map(d=>`<div class="cal-hdr">${d}</div>`).join('')}</div>
    <div class="cal-grid">${calHtml}</div>
  </div>`;

  if(allDone){
    html+=`<div style="background:linear-gradient(135deg,#fbbf24,#f97316);border-radius:16px;padding:16px;text-align:center;margin-bottom:12px;box-shadow:0 4px 14px rgba(251,191,36,.35)">
      <div style="font-size:2rem;margin-bottom:4px">🏆</div>
      <div style="font-family:'Nunito',sans-serif;font-weight:900;font-size:1.1rem;color:white">Výborně, ${p.name}!</div>
      <div style="font-size:.8rem;color:rgba(255,255,255,.85);margin-top:2px">Dnes jsi splnil všechno. Jsi profík!</div>
    </div>`;
  }

  document.getElementById('page-home').innerHTML=html;
}

function doTask(id,type){
  soundTap();
  if(type==='theory'){showTab('quiz');return}
  if(type==='athletic'||type==='throwing'||type==='batting'||type==='catching'){showTab('activity');return}
  if(type==='mental'||type==='gear'){
    // Show activity detail and mark done
    showTab('activity');return;
  }
  markTaskDone(id);
}
function doBonus(id){soundTap();showTab('activity')}
function markTaskDone(id){
  setDoneToday(id);addRuns(1);soundComplete();renderHome();
}

function nextTraining(p){
  const days=(p.trainingDays||[]).map(Number);if(!days.length)return null;
  const now=new Date(),dow=now.getDay();
  for(let i=0;i<=7;i++){
    const d=(dow+i)%7;
    if(days.includes(d)){
      const cfg=(p.dayConfig&&p.dayConfig[d])||{};
      return{label:i===0?'Dnes':i===1?'Zítra':'Za '+i+' dny ('+DAY_NAMES[d]+')',time:cfg.time||'',place:cfg.place||''};
    }
  }
  return null;
}

function travelToken(x1,y1,x2,y2,color,delay){
  const d=(delay||0).toFixed(2);
  return `<circle cx="${x1}" cy="${y1}" r="5" fill="${color}" stroke="#0a1f0a" stroke-width="1.5" opacity="0">
    <animate attributeName="cx" dur="2.4s" begin="${d}s" repeatCount="indefinite" calcMode="spline"
      values="${x1};${x2};${x2};${x1}" keyTimes="0;0.42;0.9;1" keySplines="0.45 0 0.25 1;0 0 1 1;0 0 1 1"/>
    <animate attributeName="cy" dur="2.4s" begin="${d}s" repeatCount="indefinite" calcMode="spline"
      values="${y1};${y2};${y2};${y1}" keyTimes="0;0.42;0.9;1" keySplines="0.45 0 0.25 1;0 0 1 1;0 0 1 1"/>
    <animate attributeName="opacity" dur="2.4s" begin="${d}s" repeatCount="indefinite"
      values="0;1;1;1;0;0" keyTimes="0;0.05;0.42;0.82;0.9;1"/>
  </circle>`;
}
function targetPulse(x,y,color,delay){
  const d=(delay||0).toFixed(2);
  return `<circle cx="${x}" cy="${y}" r="3" fill="none" stroke="${color}" stroke-width="2" opacity="0">
    <animate attributeName="r" values="3;12" dur="2.4s" begin="${d}s" repeatCount="indefinite" calcMode="spline" keySplines="0.3 0 0.7 1" keyTimes="0;1"/>
    <animate attributeName="opacity" values="0;0;0.8;0" dur="2.4s" begin="${d}s" repeatCount="indefinite" keyTimes="0;0.4;0.55;0.85"/>
  </circle>`;
}
function meRing(x,y,r,color){
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${color}" stroke-width="2" opacity="0.9">
    <animate attributeName="r" values="${r};${r+7};${r}" dur="1.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.6s" repeatCount="indefinite" keyTimes="0;0.5;1"/>
  </circle>`;
}

const BALL_ART=`<g>
  <ellipse cx="0" cy="5.5" rx="4" ry="1.3" fill="#000" opacity="0.15"/>
  <circle r="5.5" fill="#fff" stroke="#ddd" stroke-width="0.7"/>

function actorAnim(art,wps,T){
  const kt=[],tr=[];let last=-1;
  wps.forEach(w=>{let t=w.t;if(t<=last)t=last+0.001;if(t>1)t=1;last=t;kt.push(t.toFixed(4));tr.push(`${w.x} ${w.y}`);});
  const sp=Array(Math.max(kt.length-1,1)).fill('0.42 0 0.28 1').join(';');
  return `<g><animateTransform attributeName="transform" type="translate" dur="${T}s" repeatCount="indefinite"
    calcMode="spline" keyTimes="${kt.join(';')}" values="${tr.join(';')}" keySplines="${sp}"/>${art}</g>`;
}
function resultPop(x,y,color,text,T){
  const w=Math.max(30,text.length*5.8+10);
  return `<g opacity="0">
    <animate attributeName="opacity" dur="${T}s" repeatCount="indefinite" keyTimes="0;0.78;0.83;0.95;1" values="0;0;1;1;0"/>
    <circle cx="${x}" cy="${y}" r="3" fill="none" stroke="${color}" stroke-width="2">
      <animate attributeName="r" dur="${T}s" repeatCount="indefinite" keyTimes="0;0.78;0.88;1" values="3;3;13;13"/>
    </circle>
    <rect x="${x-w/2}" y="${y-24}" width="${w}" height="14" rx="4" fill="#0a1f0a" stroke="${color}" stroke-width="1.2"/>
    <text x="${x}" y="${y-13}" text-anchor="middle" font-size="8.5" font-weight="800" fill="${color}" font-family="Nunito,sans-serif">${text}</text>
  </g>`;
}

// Animované hřiště pro kvíz
function fieldQAnim(o={}){
  const W=200,H=165;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  // Grass + infield
  s+=`<ellipse cx="100" cy="85" rx="96" ry="76" fill="#1a3a10"/>`;
  s+=`<polygon points="100,140 158,86 100,32 42,86" fill="#2d1e08"/>`;
  s+=`<circle cx="100" cy="100" r="13" fill="none" stroke="#5a3a1a" stroke-width="1.2" stroke-dasharray="3,2"/>`;
  // Bases
  const bp={home:[100,140],first:[158,86],second:[100,32],third:[42,86]};
  const rs=new Set(o.runners||[]);
  for(const[n,[x,y]] of Object.entries(bp)){
    if(n==='home'){s+=`<polygon points="${x},${y-6} ${x+6},${y} ${x},${y+4} ${x-6},${y}" fill="#d4c090" stroke="#8a7040" stroke-width="1.5"/>`;
    }else{const num=n==='first'?1:n==='second'?2:3;const on=rs.has(num);
      s+=`<rect x="${x-5}" y="${y-5}" width="10" height="10" rx="2" fill="${on?'#f97316':'#3d2408'}" stroke="${on?'#ea580c':'#6b4a20'}" stroke-width="1.5" transform="rotate(45,${x},${y})"/>`;
    }
  }
  s+=`<circle cx="100" cy="100" r="4" fill="#5a3a1a" stroke="#8a6030" stroke-width="1"/>`;
  // Static fielder dots
  const fp={p:[100,100],c:[100,148],s1b:[153,98],s2b:[124,72],ss:[76,72],s3b:[48,98],lf:[40,46],cf:[100,18],rf:[160,46]};
  for(const[k,[fx,fy]] of Object.entries(fp)){
    if(o.myPos===k&&!o.anim)continue; // skip if animated
    const me=(!o.anim)&&o.myPos===k;
    if(me){
      s+=meRing(fx,fy,9,'#3d8ef0');
      s+=`<circle cx="${fx}" cy="${fy}" r="8" fill="#1e3a6e" stroke="#3d8ef0" stroke-width="2"/>`;
      s+=`<text x="${fx}" y="${fy+2.5}" text-anchor="middle" font-size="5" font-weight="800" fill="#3d8ef0" font-family="Nunito,sans-serif">TY</text>`;
    } else {
      s+=`<circle cx="${fx}" cy="${fy}" r="4" fill="#1e3a10" stroke="#3d6e3a" stroke-width="1.2"/>`;
      const l=k==='s1b'?'1B':k==='s2b'?'2B':k==='ss'?'SS':k==='s3b'?'3B':k.toUpperCase();
      s+=`<text x="${fx}" y="${fy+2}" text-anchor="middle" font-size="4" fill="#4a8a4a" font-family="sans-serif">${l}</text>`;
    }
  }
  // Batter
  if(o.showBatter!==false){
    const me=(!o.anim)&&o.myPos==='bat';
    if(me){
      s+=meRing(112,144,8,'#f97316');
      s+=`<circle cx="112" cy="144" r="7" fill="#3d1a00" stroke="#f97316" stroke-width="2"/>`;
      s+=`<text x="112" y="133" text-anchor="middle" font-size="5.5" font-weight="800" fill="#f97316" font-family="Nunito,sans-serif">TY</text>`;
    } else {
      s+=`<circle cx="112" cy="144" r="4" fill="#2d1a00" stroke="#6b4a20" stroke-width="1.2"/>`;
    }
  }
  // Static arrows
  for(const[i,a] of (o.arrows||[]).entries()){
    const[x1,y1]=a.from,[x2,y2]=a.to,c=a.color||'#3d8ef0';
    const id='qa'+Math.random().toString(36).slice(2,6);
    const delay=i*0.4;
    s+=`<defs><marker id="${id}" markerWidth="6" markerHeight="4" refX="4" refY="2" orient="auto"><polygon points="0 0,6 2,0 4" fill="${c}" opacity="0.5"/></marker></defs>`;
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="1.5" opacity="0.35" marker-end="url(#${id})"/>`;
    s+=travelToken(x1,y1,x2,y2,c,delay);
    s+=targetPulse(x2,y2,c,delay);
  }
  // Animated actors
  if(o.anim){
    const a=o.anim,T=a.T||5,k=a.steps.length||1,tail=a.result?0.18:0.05,pl=(1-tail)/k,mv=0.65;
    const init=a.init||{},pos={},wp={};
    Object.keys(init).forEach(key=>{pos[key]=init[key].slice();wp[key]=[{t:0,x:pos[key][0],y:pos[key][1]}];});
    a.steps.forEach((moves,i)=>{
      const st=i*pl;
      moves.forEach(mo=>{
        const key=mo.m;
        if(!wp[key]){pos[key]=(mo.from||mo.to).slice();wp[key]=[{t:0,x:pos[key][0],y:pos[key][1]}];}
        const from=pos[key].slice();
        if(st>0.001)wp[key].push({t:st,x:from[0],y:from[1]});
        wp[key].push({t:st+pl*mv,x:mo.to[0],y:mo.to[1]});
        pos[key]=mo.to.slice();
      });
    });
    Object.keys(wp).forEach(key=>{wp[key].push({t:1,x:pos[key][0],y:pos[key][1]});});
    const heroArtStr=heroArt('#3d8ef0');
    if(wp.ball) s+=actorAnim(BALL_ART,wp.ball,T);
    if(wp.hero) s+=actorAnim(heroArtStr,wp.hero,T);
    if(a.result) s+=resultPop(a.result.at[0],a.result.at[1],a.result.c||'#3d8ef0',a.result.text,T);
  }
  if(o.myRunner&&!o.anim){
    const rp={1:[158,86],2:[100,32],3:[42,86]};const[rx,ry]=rp[o.myRunner];
    s+=meRing(rx+8,ry-8,7,'#f97316');
    s+=`<circle cx="${rx+8}" cy="${ry-8}" r="6" fill="#3d1a00" stroke="#f97316" stroke-width="2"/>`;
    s+=`<text x="${rx+8}" y="${ry-4}" text-anchor="middle" font-size="4.5" font-weight="800" fill="#f97316" font-family="sans-serif">TY</text>`;
  }
  s+=`</svg>`;return s;
}

    if(n==='home'){s+=`<polygon points="${x},${y-6} ${x+6},${y} ${x},${y+4} ${x-6},${y}" fill="#92400e"/>`;
    }else{const num=n==='first'?1:n==='second'?2:3;const on=rs.has(num);
      s+=`<rect x="${x-5}" y="${y-5}" width="10" height="10" rx="2" fill="${on?'#f97316':'#fef3c7'}" stroke="${on?'#ea580c':'#d97706'}" stroke-width="1.5" transform="rotate(45,${x},${y})"/>`;
    }
  }
  const fp={p:[90,95],c:[90,143],s1b:[143,92],s2b:[116,68],ss:[66,68],s3b:[38,92],lf:[34,44],cf:[90,14],rf:[146,44]};
  for(const[k,[fx,fy]] of Object.entries(fp)){
    const me=o.myPos===k;
    const clr=me?'#3d8ef0':'#059669';
    s+=`<circle cx="${fx}" cy="${fy}" r="${me?7:4}" fill="${me?'#dbeafe':'#d1fae5'}" stroke="${clr}" stroke-width="${me?2:1.5}"/>`;
    const l=k==='s1b'?'1B':k==='s2b'?'2B':k==='ss'?'SS':k==='s3b'?'3B':k.toUpperCase();
    s+=`<text x="${fx}" y="${fy+2.5}" text-anchor="middle" font-size="${me?5.5:4.5}" font-weight="800" fill="${clr}" font-family="sans-serif">${me?'TY':l}</text>`;
  }
  if(o.myPos==='bat'){
    s+=`<circle cx="${90+12}" cy="138" r="6" fill="#dbeafe" stroke="#3d8ef0" stroke-width="2"/>`;
    s+=`<text x="${90+12}" y="140.5" text-anchor="middle" font-size="5" font-weight="800" fill="#3d8ef0" font-family="sans-serif">TY</text>`;
  }
  if(o.myRunner){const rp={1:[148,78],2:[90,21],3:[32,78]};const[rx,ry]=rp[o.myRunner];
    s+=`<circle cx="${rx+8}" cy="${ry-8}" r="5" fill="#dbeafe" stroke="#3d8ef0" stroke-width="2"/>`;
    s+=`<text x="${rx+8}" y="${ry-4}" text-anchor="middle" font-size="4" font-weight="800" fill="#3d8ef0" font-family="sans-serif">TY</text>`;
  }
  for(const a of(o.arrows||[])){
    const[x1,y1]=a.from,[x2,y2]=a.to,c=a.color||'#3d8ef0';
    const id='qa'+Math.random().toString(36).slice(2,6);
    s+=`<defs><marker id="${id}" markerWidth="6" markerHeight="4" refX="4" refY="2" orient="auto"><polygon points="0 0,6 2,0 4" fill="${c}"/></marker></defs>`;
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="2" marker-end="url(#${id})"/>`;
  }
  s+=`</svg>`;return s;
}

function startQuiz(mode){
  let pool=[];
  if(mode==='all')pool=shuf([...QQ]).slice(0,10);
  else if(mode==='r1')pool=shuf([...QQ]).slice(0,1);
  else pool=shuf(QQ.filter(q=>q.cat===mode)).slice(0,8);
  QS={pool,idx:0,lives:3,score:0,streak:0};
  renderQ();
  speak(pool[0].q);
}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function renderQ(){
  if(QS.idx>=QS.pool.length){endQuiz();return}
  const q=QS.pool[QS.idx],prog=Math.round((QS.idx/QS.pool.length)*100);
  const isFC=q.type==='fc';
  let opts='';
  if(!isFC){
    opts=`<div class="mc-opts">
      ${q.opts.map((o,i)=>`<button class="mc-opt" id="qo${i}" onclick="answerMC(${i})">${o}</button>`).join('')}
    </div>`;
  } else {
    opts=`<button class="fc-reveal-btn" onclick="fcReveal()">👁 Zobrazit odpověď</button>
      <div class="fc-ans" id="fca">${q.ans}</div>
      <div class="fc-rate" id="fcr" style="display:none;gap:8px">
        <button class="fc-rate-btn fc-rate-yes" style="flex:1" onclick="fcRate(true)">✓ Věděl jsem!</button>
        <button class="fc-rate-btn fc-rate-no" style="flex:1" onclick="fcRate(false)">✗ Nevěděl</button>
      </div>`;
  }

  document.getElementById('page-quiz').innerHTML=`
    <div class="quiz-top">
      <div class="quiz-hearts">${[0,1,2].map(i=>`<span style="opacity:${i>=QS.lives?.3:1}">❤️</span>`).join('')}</div>
      <div class="quiz-prog-wrap">
        <div class="quiz-prog-bar"><div class="quiz-prog-fill" style="width:${prog}%"></div></div>
        <div class="quiz-prog-lbl">${QS.idx+1} / ${QS.pool.length}</div>
      </div>
      ${QS.streak>=2?`<div class="quiz-streak">🔥 ${QS.streak}×</div>`:''}
    </div>
    <div class="qcard">
      <div class="qcard-type">${isFC?'Přemysli a odpověz':'Vyber správnou odpověď'}</div>
      <div class="qcard-q">${q.q}</div>
      ${q.term?`<div class="qcard-term">${q.term}</div>`:''}
      ${q.diag?`<div class="qcard-diag">${q.diag}</div>`:''}
      ${opts}
      <div class="quiz-fb" id="qfb"></div>
      <div class="quiz-xp-pop" id="qxp"></div>
    </div>
    <button class="btn btn-primary btn-w" id="qnxt" style="display:none" onclick="nextQ()">Další → </button>
    <button class="btn btn-ghost btn-w" style="margin-top:8px;font-size:.8rem;color:var(--text3)" onclick="renderQuizStart()">✕ Ukončit</button>`;
}

function answerMC(i){
  const q=QS.pool[QS.idx],ok=i===q.ans;
  document.querySelectorAll('.mc-opt').forEach(b=>b.disabled=true);
  document.getElementById('qo'+q.ans).classList.add('correct');
  if(!ok){
    document.getElementById('qo'+i).classList.add('wrong');
    QS.lives--;QS.streak=0;soundWrong();
    if(QS.lives<=0){setTimeout(endQuiz,1200);return}
  } else {
    QS.score++;QS.streak++;soundCorrect();
    showXP('+1 run'+(QS.streak>=3?' 🔥':''));
  }
  showFB(ok,q.exp);
  document.getElementById('qnxt').style.display='flex';
  logQZ(ok);
}
function fcReveal(){
  document.getElementById('fca').classList.add('show');
  document.querySelector('.fc-reveal-btn').style.display='none';
  document.getElementById('fcr').style.display='flex';
}
function fcRate(knew){
  if(knew){QS.score++;QS.streak++;soundCorrect();showXP('+1 run');}
  else{QS.streak=0;soundWrong();}
  document.getElementById('fcr').style.display='none';
  showFB(knew,QS.pool[QS.idx].exp);
  document.getElementById('qnxt').style.display='flex';
  logQZ(knew);
}
function showFB(ok,txt){
  const el=document.getElementById('qfb');
  el.className='quiz-fb show '+(ok?'ok':'err');
  el.innerHTML=(ok?'<strong>✓ Správně!</strong> ':'<strong>✗ Tak to není...</strong> ')+txt;
}
function showXP(txt){const el=document.getElementById('qxp');if(el){el.textContent=txt;el.classList.add('show');}}
function nextQ(){
  speak(QS.pool[QS.idx+1]?.q||'');
  QS.idx++;renderQ();
}
function logQZ(ok){
  if(ok){addRuns(1);}
  const d=today();S.set('qz-'+d,(S.get('qz-'+d)||0)+1);
  // Mark theory task done
  setDoneToday('q-basics');
}
function endQuiz(){
  soundComplete();recordDay();
  const total=QS.pool.length,pct=Math.round((QS.score/total)*100);
  let em='⭐';let title='Dobrá práce!';let msg=`${QS.score} z ${total} správně.`;
  if(pct>=90){em='🏆';title='Perfektní!';msg='Jsi opravdový hráč!';}
  else if(pct>=70){em='🎉';title='Super výkon!';msg='Skoro perfektní. Zkus znovu?';}

  document.getElementById('page-quiz').innerHTML=`
    <div class="quiz-end">
      <span class="qe-em">${em}</span>
      <div class="qe-title">${title}</div>
      <div class="qe-sub">${msg}</div>
      <div class="qe-score">+${QS.score} bodů!</div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn btn-primary" onclick="startQuiz('all')">🔄 Znovu</button>
        <button class="btn btn-ghost" onclick="renderQuizStart()">← Menu</button>
      </div>
    </div>`;
}

function renderActivity(){
  const done=getDoneToday();
  let html=`<div class="section-title">Dnešní aktivity</div>`;
  // Show today's physical task first
  const todayTasks=getTodayTasks();
  const todayPhysical=todayTasks.find(t=>['athletic','throwing','batting','catching'].includes(t.type));
  if(todayPhysical&&todayPhysical.steps){
    const actMatch=ACTIVITIES.find(a=>a.id.includes(todayPhysical.id.split('-')[1]))||ACTIVITIES[0];
    html+=renderActCard(actMatch,done,true);
  }
  html+=`<div class="section-title">Všechna cvičení</div>`;
  ACTIVITIES.forEach(act=>{
    html+=renderActCard(act,done,false);
  });
  document.getElementById('page-activity').innerHTML=html;
}

function renderActCard(act,done,highlight){
  const isDone=done[act.id];
  return `<div class="act-card${isDone?' completed':''}" id="act-${act.id}" style="${highlight?'border-color:var(--hippos);':''}" >
    <div class="act-head" onclick="toggleAct('${act.id}')">
      <div class="act-emoji">${act.emoji}</div>
      <div class="act-info">
        <div class="act-title">${act.title}${highlight?' ⭐':''}</div>
        <div class="act-desc">${act.desc}</div>
      </div>
      <div class="act-xp">+${act.xp} bodů</div>
    </div>
    <div class="act-body" id="ab-${act.id}">
      <div class="act-steps">
        ${act.steps.map(s=>`
          <div class="act-step">
            <div class="ast-n">${s.n}</div>
            <div class="ast-text"><strong>${s.t}</strong><br>${s.txt}</div>
          </div>`).join('')}
      </div>
      ${!isDone?`<button class="act-done-btn" onclick="completeAct('${act.id}',${act.xp})">
        ✅ Hotovo! +${act.xp} bodů
      </button>`:`<div style="text-align:center;padding:8px 16px 16px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;color:var(--green)">✓ Splněno dnes!</div>`}
    </div>
  </div>`;
}

function toggleAct(id){
  const body=document.getElementById('ab-'+id);
  body.classList.toggle('show');
  soundTap();
  // TTS: read the first step
  if(body.classList.contains('show')){
    const act=ACTIVITIES.find(a=>a.id===id);
    if(act)speak(act.title+'. '+act.steps[0].t+'. '+act.steps[0].txt);
  }
}
function completeAct(id,xp){
  setDoneToday(id);addRuns(xp);soundComplete();
  renderActivity();renderHome();
}

function renderBasics(){
  const lv1=BASICS.filter(b=>b.lv===1);
  const lv2=BASICS.filter(b=>b.lv===2);
  let html=`<div class="section-title">Základy – pro každého</div>`;
  html+=lv1.map(b=>bcCard(b)).join('');
  html+=`<div class="section-title">Techniky – jak se zlepšit</div>`;
  html+=lv2.map(b=>bcCard(b)).join('');
  document.getElementById('page-basics').innerHTML=html;
}

function bcCard(b){
  const i=BASICS.indexOf(b);
  const lvLabel=b.lv===1?'Základy':'Techniky';
  const lvClass=b.lv===1?'bc-lv-1':'bc-lv-2';
  return `<div class="bc-card" onclick="bcToggle(${i})">
    <div class="bc-head">
      <div class="bc-emoji" style="background:${b.bg}">${b.emoji}</div>
      <div class="bc-info">
        <div class="bc-title">${b.title}</div>
        <div class="bc-sub">${b.sub}</div>
      </div>
      <span class="bc-lv ${lvClass}">${lvLabel}</span>
      <span class="bc-tog" id="bt-${i}">▾</span>
    </div>
    <div class="bc-body" id="bb-${i}"><div class="bc-inner">${b.body}</div></div>
  </div>`;
}
function bcToggle(i){
  document.getElementById('bb-'+i).classList.toggle('show');
  document.getElementById('bt-'+i).classList.toggle('open');
  soundTap();
  const b=BASICS[i];
  speak(b.title+'. '+b.sub);
}
