<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baseball">
<meta name="theme-color" content="#1a3a6b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>⚾ Hroši Brno</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --hippos:#3d8ef0;--navy:#1a3a6b;--navy2:#234d8a;--blue2:#2a6abf;
  --sky:#e8f2ff;--sky2:#d0e4ff;--white:#fff;--off:#f0f4fa;
  --text:#1a2a4a;--text2:#4a6080;--text3:#8aa0bc;
  --green:#22c55e;--gd:#16a34a;--red:#ef4444;
  --org:#f97316;--yel:#fbbf24;--pur:#8b5cf6;
  --card:#fff;--cb:#dde8f7;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
html{height:100%;height:-webkit-fill-available;background:var(--off)}
body{
  min-height:100vh;min-height:-webkit-fill-available;min-height:100dvh;
  background:var(--off);color:var(--text);font-family:'Nunito Sans',sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  position:fixed;width:100%;top:0;left:0;right:0;bottom:0;
  padding-top:var(--sat);padding-left:var(--sal);padding-right:var(--sar);
}

/* ══ CONFETTI ══ */
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:999;display:none}

/* ══ HEADER ══ */
.hdr{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);
  padding:10px 16px;display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;position:relative;overflow:hidden;
}
.hdr::before{content:'';position:absolute;right:-20px;top:-20px;width:100px;height:100px;
  background:radial-gradient(circle,rgba(61,142,240,.3),transparent 70%);pointer-events:none}
.hdr-l{display:flex;align-items:center;gap:10px}
.hdr-avatar{
  width:40px;height:40px;border-radius:50%;background:var(--hippos);
  border:2.5px solid rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;
  font-family:'Nunito',sans-serif;font-size:1rem;font-weight:900;color:white;
  flex-shrink:0;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.hdr-name{font-family:'Nunito',sans-serif;font-weight:900;font-size:.95rem;color:white;line-height:1.1}
.hdr-sub{font-size:.6rem;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.07em}
.hdr-r{display:flex;align-items:center;gap:8px}
.hdr-pill{background:rgba(255,255,255,.15);border-radius:20px;padding:4px 10px;
  display:flex;align-items:center;gap:4px;
  font-family:'Nunito',sans-serif;font-weight:900;font-size:.85rem;color:white}
.snd-btn{width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.15);
  color:white;font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent}

/* ══ TABS ══ */
.tabs{display:flex;background:white;border-bottom:2px solid var(--sky2);flex-shrink:0}
.tab{flex:1;padding:8px 2px 6px;text-align:center;cursor:pointer;border:none;
  background:none;-webkit-tap-highlight-color:transparent;transition:all .15s}
.tab .tic{font-size:1.15rem;display:block;margin-bottom:1px}
.tab .tlb{font-size:.6rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.tab.active .tlb{color:var(--hippos)}
.tab.active{border-bottom:2.5px solid var(--hippos);margin-bottom:-2px}

/* ══ SCROLL ══ */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  min-height:0;overscroll-behavior:contain;
  padding:14px 14px calc(18px + var(--sab))}
.page{display:none}.page.active{display:block}

/* ══ SHARED ══ */
.card{background:var(--card);border:1px solid var(--cb);border-radius:16px;
  margin-bottom:10px;overflow:hidden;box-shadow:0 2px 8px rgba(26,58,107,.06)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:14px;border:none;cursor:pointer;
  font-family:'Nunito',sans-serif;font-weight:800;font-size:.95rem;
  -webkit-tap-highlight-color:transparent;-webkit-appearance:none;
  transition:transform .1s,box-shadow .1s;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,var(--hippos),var(--blue2));color:white}
.btn-g{background:linear-gradient(135deg,var(--green),var(--gd));color:white}
.btn-ghost{background:var(--sky);color:var(--navy);box-shadow:none;border:1px solid var(--sky2)}
.btn-w{width:100%}
.stitle{font-family:'Nunito',sans-serif;font-weight:900;font-size:.75rem;
  text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin:18px 0 8px}
.stitle:first-child{margin-top:0}

/* ══ HROCH MASKOT ══ */
.hippo-bubble{
  display:flex;align-items:flex-end;gap:10px;margin-bottom:14px;
  animation:slideIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hippo-svg{flex-shrink:0;width:60px;height:60px}
.hippo-speech{
  background:white;border:2px solid var(--sky2);border-radius:16px 16px 16px 4px;
  padding:10px 14px;font-size:.85rem;font-weight:700;color:var(--text);
  line-height:1.4;box-shadow:0 2px 8px rgba(26,58,107,.08);flex:1;
  position:relative;
}
.hippo-speech::before{content:'';position:absolute;left:-10px;bottom:10px;
  width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;
  border-right:10px solid var(--sky2)}
.hippo-speech::after{content:'';position:absolute;left:-7px;bottom:11px;
  width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;
  border-right:9px solid white}
.hippo-name{font-size:.6rem;font-weight:800;color:var(--hippos);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}

/* ══ PROGRESS RING ══ */
.ring-wrap{display:flex;justify-content:center;margin-bottom:14px}
.ring-outer{position:relative;width:120px;height:120px}
.ring-svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--sky2);stroke-width:10}
.ring-fill{fill:none;stroke-width:10;stroke-linecap:round;
  stroke-dasharray:283;stroke-dashoffset:283;
  transition:stroke-dashoffset .8s cubic-bezier(.34,1.56,.64,1)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none}
.ring-emoji{font-size:1.8rem;line-height:1}
.ring-label{font-family:'Nunito',sans-serif;font-weight:900;font-size:.7rem;
  color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

/* ══ DAILY HEADER ══ */
.daily-hdr{
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  border-radius:16px;padding:16px;margin-bottom:12px;
  position:relative;overflow:hidden;
}
.daily-hdr::after{content:'⚾';position:absolute;right:-6px;bottom:-10px;
  font-size:4rem;opacity:.08;pointer-events:none}
.dh-greet{font-size:.68rem;font-weight:700;color:rgba(255,255,255,.55);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.dh-name{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.5rem;color:white;margin-bottom:10px}
.dh-bar-lbl{display:flex;justify-content:space-between;font-size:.7rem;
  color:rgba(255,255,255,.65);font-weight:700;margin-bottom:5px}
.dh-bar{height:10px;background:rgba(255,255,255,.18);border-radius:5px;overflow:hidden}
.dh-bar-fill{height:100%;background:linear-gradient(90deg,var(--yel),var(--org));
  border-radius:5px;transition:width .7s cubic-bezier(.34,1.56,.64,1)}

/* ══ STATS ROW ══ */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.scard{background:white;border:1px solid var(--cb);border-radius:14px;
  padding:11px 8px;text-align:center;box-shadow:0 2px 6px rgba(26,58,107,.05)}
.scard-val{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.5rem;line-height:1}
.scard-lbl{font-size:.58rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--text3);margin-top:2px}

/* ══ TASK CARDS ══ */
.task-card{
  background:white;border:2.5px solid var(--cb);border-radius:16px;
  padding:14px;margin-bottom:10px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:all .15s;box-shadow:0 2px 8px rgba(26,58,107,.05);
  display:flex;align-items:center;gap:12px;
}
.task-card:active{transform:scale(.98)}
.task-card.done{background:var(--sky);border-color:var(--hippos)}
.task-card.locked{opacity:.45;cursor:default}
.task-ic{width:50px;height:50px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.task-body{flex:1}
.task-cat{font-size:.6rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.08em;color:var(--text3);margin-bottom:1px}
.task-name{font-family:'Nunito',sans-serif;font-weight:800;font-size:.95rem;
  color:var(--text);line-height:1.2}
.task-time{font-size:.7rem;color:var(--text3);font-weight:600;margin-top:2px}
.task-check{width:32px;height:32px;border-radius:50%;border:3px solid var(--cb);
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  transition:all .2s;flex-shrink:0}
.task-card.done .task-check{background:var(--hippos);border-color:var(--hippos);color:white}

/* ══ BONUS ══ */
.bonus-card{
  background:linear-gradient(135deg,#6d28d9,#8b5cf6);
  border-radius:16px;padding:14px;margin-bottom:12px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 4px 14px rgba(109,40,217,.3);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .15s;
}
.bonus-card:active{transform:scale(.98)}
.bonus-card.locked{opacity:.4;cursor:default;filter:grayscale(.4)}
.bonus-ic{font-size:2rem;flex-shrink:0;animation:wiggle 2s ease infinite}
@keyframes wiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.bonus-card.locked .bonus-ic{animation:none}
.bonus-lbl{font-size:.62rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.08em;color:rgba(255,255,255,.65)}
.bonus-name{font-family:'Nunito',sans-serif;font-weight:900;font-size:.95rem;color:white}
.bonus-hint{font-size:.7rem;color:rgba(255,255,255,.55);margin-top:1px}

/* ══ CALENDAR ══ */
.cal-card{background:white;border:1px solid var(--cb);border-radius:16px;
  padding:13px;margin-bottom:10px;box-shadow:0 2px 6px rgba(26,58,107,.05)}
.cal-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:.9rem;
  color:var(--text);margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.cal-month{font-size:.7rem;font-weight:700;color:var(--text3)}
.cal-hdrs{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
.cal-hdr{font-size:.52rem;font-weight:800;text-align:center;
  color:var(--text3);text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cday{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-size:.65rem;font-weight:700;color:var(--text3)}
.cday.empty{opacity:0;pointer-events:none}
.cday.training{background:var(--sky);color:var(--hippos)}
.cday.done{background:var(--hippos);color:white}
.cday.today{outline:2.5px solid var(--org);outline-offset:-1px;font-weight:900}

/* ══ ONBOARDING ══ */
#ob{position:fixed;inset:0;
  background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 55%,var(--hippos) 100%);
  z-index:300;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:32px 24px;
  padding-top:calc(32px + var(--sat));padding-bottom:calc(32px + var(--sab));
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.ob-hippo{font-size:4.5rem;text-align:center;margin-bottom:4px;
  animation:bob 2s ease infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.ob-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:2rem;
  color:white;text-align:center;margin-bottom:4px}
.ob-sub{font-size:.88rem;color:rgba(255,255,255,.65);text-align:center;margin-bottom:28px}
.ob-f{width:100%;max-width:340px;margin-bottom:12px}
.ob-lbl{font-size:.7rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:rgba(255,255,255,.65);margin-bottom:5px}
.ob-in{width:100%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.25);
  border-radius:12px;padding:13px 15px;font-size:1rem;font-family:'Nunito',sans-serif;
  font-weight:700;color:white;-webkit-appearance:none;outline:none;transition:border-color .15s}
.ob-in:focus{border-color:rgba(255,255,255,.7)}
.ob-in::placeholder{color:rgba(255,255,255,.35)}
.ob-cats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
  margin-bottom:18px;width:100%;max-width:340px}
.ob-cat{padding:9px 4px;border-radius:10px;border:2px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);color:white;font-family:'Nunito',sans-serif;
  font-weight:800;font-size:.8rem;text-align:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:all .15s}
.ob-cat.sel{background:var(--hippos);border-color:var(--hippos)}

/* ══ SETTINGS ══ */
#set-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
  display:none;align-items:flex-end;justify-content:center}
#set-ov.show{display:flex}
.set-sh{background:var(--off);border-radius:20px 20px 0 0;
  padding:18px 18px calc(18px + var(--sab));width:100%;max-width:520px;
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.set-handle{width:36px;height:4px;background:var(--text3);border-radius:2px;
  margin:0 auto 14px;opacity:.4}
.set-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.1rem;
  color:var(--text);margin-bottom:14px}
.set-f{margin-bottom:11px}
.set-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--text3);margin-bottom:5px}
.set-in{width:100%;background:var(--sky);border:1.5px solid var(--sky2);
  border-radius:10px;padding:11px 13px;font-size:.95rem;font-family:'Nunito Sans',sans-serif;
  font-weight:600;color:var(--text);-webkit-appearance:none;outline:none}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day-b{padding:6px 2px;border-radius:6px;border:1.5px solid var(--sky2);
  background:var(--sky);color:var(--text3);font-family:'Nunito',sans-serif;
  font-weight:800;font-size:.65rem;text-align:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:all .12s}
.day-b.on{background:var(--hippos);border-color:var(--hippos);color:white}
.tog-row{display:flex;gap:7px}
.tog-btn{flex:1;padding:9px;border-radius:9px;border:1.5px solid var(--sky2);
  background:var(--sky);color:var(--text2);font-family:'Nunito',sans-serif;
  font-weight:800;font-size:.82rem;cursor:pointer;text-align:center;
  -webkit-tap-highlight-color:transparent;transition:all .12s}
.tog-btn.on-yes{background:var(--hippos);border-color:var(--hippos);color:white}
.tog-btn.on-no{background:var(--red);border-color:var(--red);color:white}

/* ══ QUIZ ══ */
.qz-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.qz-hearts{display:flex;gap:3px;font-size:1.2rem}
.qz-pw{flex:1}
.qz-pbar{height:10px;background:var(--sky2);border-radius:5px;overflow:hidden}
.qz-pfill{height:100%;background:linear-gradient(90deg,var(--hippos),var(--navy));
  border-radius:5px;transition:width .3s}
.qz-plbl{font-size:.6rem;font-weight:700;color:var(--text3);text-align:right;margin-top:2px}
.qz-streak{font-family:'Nunito',sans-serif;font-weight:900;font-size:.85rem;
  color:var(--org);background:#fff7ed;border:1.5px solid #fed7aa;
  border-radius:8px;padding:3px 8px;flex-shrink:0}
.qcard{background:white;border:2px solid var(--cb);border-radius:20px;
  padding:18px;margin-bottom:10px;box-shadow:0 4px 16px rgba(26,58,107,.07)}
.qcard-type{font-size:.6rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--text3);margin-bottom:7px}
.qcard-q{font-family:'Nunito',sans-serif;font-weight:800;font-size:1.15rem;
  color:var(--text);line-height:1.3;margin-bottom:10px}
.qcard-diag{display:flex;justify-content:center;margin-bottom:10px}
.qcard-diag svg{max-width:195px;width:100%;border-radius:12px}
.qcard-term{background:var(--sky);border-radius:10px;padding:8px 11px;
  margin-bottom:10px;font-size:.76rem;color:var(--navy);line-height:1.4;font-weight:600}
.qcard-term strong{color:var(--hippos)}
.mc-opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.mc-o{padding:13px 8px;border-radius:12px;border:2.5px solid var(--cb);
  background:white;color:var(--text);font-family:'Nunito',sans-serif;font-weight:700;
  font-size:.88rem;cursor:pointer;text-align:center;transition:all .15s;
  -webkit-tap-highlight-color:transparent;-webkit-appearance:none;
  line-height:1.35;box-shadow:0 2px 5px rgba(26,58,107,.05)}
.mc-o:active{transform:scale(.97)}
.mc-o.correct{background:#dcfce7;border-color:var(--green);color:var(--gd);
  animation:correctBounce .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes correctBounce{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.mc-o.wrong{background:#fee2e2;border-color:var(--red);color:#dc2626;
  animation:wrongShake .3s ease}
@keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mc-o:disabled{cursor:default;transform:none}
.fc-rev{width:100%;padding:13px;border-radius:12px;border:2.5px dashed var(--hippos);
  background:var(--sky);color:var(--hippos);font-family:'Nunito',sans-serif;
  font-weight:800;font-size:.9rem;cursor:pointer;-webkit-appearance:none;margin-bottom:9px}
.fc-ans{display:none;background:var(--sky);border-radius:12px;padding:13px;
  margin-bottom:9px;font-size:.88rem;font-weight:600;color:var(--text);line-height:1.5}
.fc-ans.show{display:block}
.fc-rate{display:none;gap:7px}
.fcr-btn{flex:1;padding:12px;border-radius:11px;border:none;font-family:'Nunito',sans-serif;
  font-weight:800;font-size:.86rem;cursor:pointer;-webkit-appearance:none}
.fcr-yes{background:#dcfce7;color:var(--gd)}
.fcr-no{background:#fee2e2;color:#dc2626}
.qz-fb{border-radius:12px;padding:11px 13px;margin-bottom:9px;font-size:.84rem;
  font-weight:600;line-height:1.5;display:none}
.qz-fb.show{display:block}
.qz-fb.ok{background:#dcfce7;border:1.5px solid #86efac;color:var(--gd)}
.qz-fb.err{background:#fee2e2;border:1.5px solid #fca5a5;color:#dc2626}
.qz-xp{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.1rem;
  color:var(--yel);text-align:center;margin-bottom:5px;display:none;
  text-shadow:0 2px 8px rgba(251,191,36,.4)}
.qz-xp.show{display:block;animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.qz-end{text-align:center;padding:20px 8px}
.qe-em{font-size:4rem;margin-bottom:8px;display:block;
  animation:celebSpin .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes celebSpin{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
.qe-t{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.7rem;color:var(--text);margin-bottom:4px}

// ══ STORAGE ══
const S={
  get(k,d=null){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
const today=()=>new Date().toISOString().slice(0,10);

// ══ PROFILE ══
const DEF={name:'',number:'27',category:'U8',coach:'trenér',runs:0,
  trainingDays:[1,3,5],dayConfig:{},soundOn:true,ttsOn:false};
function getP(){return Object.assign({},DEF,S.get('prof',{}))}
function saveP(p){S.set('prof',p);updateHdr()}
function addRuns(n){const p=getP();p.runs=(p.runs||0)+n;saveP(p)}

// ══ STREAK ══
function getStr(){return S.get('str',{count:0,lastDate:'',days:[]})}
function recordDay(){
  const t=today(),s=getStr();
  if(s.lastDate===t)return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  s.count=s.lastDate===y?s.count+1:1;s.lastDate=t;
  s.days=s.days||[];if(!s.days.includes(t))s.days.push(t);
  if(s.days.length>90)s.days=s.days.slice(-90);
  S.set('str',s);updateHdr();
}

// ══ SOUND ══
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null;
function getAC(){if(!ac&&AC)try{ac=new AC()}catch(e){}return ac}
function tone(freq,dur,type='sine',vol=.28){
  const a=getAC();if(!a||!getP().soundOn)return;
  try{const o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
    o.start();o.stop(a.currentTime+dur);}catch(e){}
}
function sndCorrect(){
  tone(523,.08,'sine',.22);
  setTimeout(()=>tone(659,.08,'sine',.22),90);
  setTimeout(()=>tone(784,.08,'sine',.22),180);
  setTimeout(()=>tone(1047,.18,'sine',.22),270);
}
function sndWrong(){tone(180,.35,'sawtooth',.18)}
function sndComplete(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.12,'sine',.18),i*100))}
function sndTap(){tone(440,.05,'sine',.12)}
function toggleSnd(){const p=getP();p.soundOn=!p.soundOn;saveP(p);updateSndBtn()}
function setSnd(v){const p=getP();p.soundOn=v==='on';saveP(p);updateSndBtn();updateSetBtns()}
function setTts(v){const p=getP();p.ttsOn=v==='on';saveP(p);updateSetBtns()}
function updateSndBtn(){document.getElementById('snd-btn').textContent=getP().soundOn?'🔊':'🔇'}
function speak(txt){
  const p=getP();if(!p.ttsOn||!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);u.lang='cs-CZ';u.rate=.95;u.pitch=1.1;
  window.speechSynthesis.speak(u);
}

// ══ CONFETTI ══
function confetti(){
  const canvas=document.getElementById('confetti-canvas');
  canvas.style.display='block';
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const ctx=canvas.getContext('2d');
  const pieces=[];const colors=['#3d8ef0','#fbbf24','#22c55e','#f97316','#8b5cf6','#ef4444'];
  for(let i=0;i<80;i++){pieces.push({
    x:Math.random()*canvas.width,y:-10,
    vx:(Math.random()-0.5)*6,vy:Math.random()*4+2,
    rot:Math.random()*360,vrot:(Math.random()-0.5)*8,
    size:Math.random()*8+4,color:colors[Math.floor(Math.random()*colors.length)],
    shape:Math.random()>.5?'rect':'circle'
  });}
  let frame=0;
  function animate(){
    if(frame++>90){canvas.style.display='none';return}
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.vrot;p.vy+=.1;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,1-frame/90);
      if(p.shape==='rect'){ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size/2);}
      else{ctx.beginPath();ctx.arc(0,0,p.size/2,0,Math.PI*2);ctx.fill();}
      ctx.restore();
    });
    requestAnimationFrame(animate);
  }
  animate();
}

function getTodayTasks(){
  const doy=Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/864e5);
  const theory=DAILY_POOL.filter(t=>t.type==='theory');
  const phys=DAILY_POOL.filter(t=>['athletic','throwing','batting','catching'].includes(t.type));
  const soft=DAILY_POOL.filter(t=>['mental','gear'].includes(t.type));
  const pick=(arr,off)=>arr[Math.abs(doy+off)%arr.length];
  return [pick(theory,0),pick(phys,1),pick(soft,2)];
}
function getTodayBonus(){
  const doy=Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/864e5);
  const extras=DAILY_POOL.filter(t=>t.type!=='theory'&&t.type!=='gear');
  return extras[doy%extras.length];
}

  d[id]=true;S.set('done-'+today(),d);

}

function renderHome(){
  const p=getP(),st=getStr();
  const tasks=getTodayTasks();const bonus=getTodayBonus();
  const done=getDone();
  const doneCount=tasks.filter(t=>done[t.id]).length;
  const allDone=doneCount>=tasks.length;
  if(allDone)recordDay();
  const pct=Math.round((doneCount/tasks.length)*100);
  // Ring stroke offset: circumference=283
  const offset=283-(283*pct/100);
  const ringColor=allDone?'#22c55e':pct>0?'#3d8ef0':'#d0e4ff';
  const now=new Date();
  const hr=now.getHours();
  const greet=hr<12?'Dobré ráno':'Čau';
  // Hippo message
  const msgs=allDone?HIPPO_MESSAGES.allDone(p.name,p.coach||'trenér'):
    st.count>3?HIPPO_MESSAGES.streak(st.count):
    HIPPO_MESSAGES[hr<12?'morning':hr<18?'afternoon':'evening'](p.name);

  // Calendar
  const y=now.getFullYear(),m=now.getMonth();
  const firstDay=new Date(y,m,1),lastDay=new Date(y,m+1,0);
  const firstDow=firstDay.getDay();const offset2=firstDow===0?6:firstDow-1;
  const stDays=new Set(st.days||[]);const trainDays=p.trainingDays||[1,3,5];
  let calHtml='';
  for(let i=0;i<offset2;i++)calHtml+=`<div class="cday empty"></div>`;
  for(let d=1;d<=lastDay.getDate();d++){
    const dd=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow=new Date(y,m,d).getDay();
    const cl=['cday',trainDays.includes(dow)?'training':'',stDays.has(dd)?'done':'',dd===today()?'today':''].filter(Boolean).join(' ');
    calHtml+=`<div class="${cl}">${d}</div>`;

  const nxt=nextTrain(p);

  let html=`
  ${hippoMsg(msgs,allDone?'cheer':'happy')}
  <div class="daily-hdr">
    <div class="dh-greet">${greet}, ${p.name} #${p.number}!</div>
    <div class="dh-name">Dnešní trénink 🏟️</div>
    <div class="dh-bar-lbl"><span>${doneCount}/${tasks.length} splněno</span><span>${allDone?'🏆 Perfektní!':pct+'%'}</span></div>

  </div>
  <div class="stats-row">

  </div>`;

  if(nxt)html+=`<div class="next-train"><div class="nt-ic">🏟️</div><div>
    <div class="nt-lbl">Příští trénink</div>
    <div class="nt-val">${nxt.label}</div>

  html+=`<div class="stitle">Dnešní úkoly</div>`;

    const isDone=done[task.id];
    html+=`<div class="task-card${isDone?' done':''}" onclick="doTask('${task.id}','${task.type}')">

function doTask(id,type){
  sndTap();
  if(type==='theory'){showTab('quiz');return}
  showTab('activity');

function nextTrain(p){
  const days=(p.trainingDays||[]).map(Number);if(!days.length)return null;
  const now=new Date(),dow=now.getDay();
  for(let i=0;i<=7;i++){
    const d=(dow+i)%7;
    if(days.includes(d)){
      const cfg=(p.dayConfig&&p.dayConfig[d])||{};
      return{label:i===0?'Dnes':i===1?'Zítra':'Za '+i+' dny ('+DAY_NAMES[d]+')',
        time:cfg.time||'',place:cfg.place||''};
    }
  }
  return null;
}

function fieldQAnim(o={}){
  const W=195,H=160;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<ellipse cx="97" cy="82" rx="93" ry="74" fill="#1a4a1a"/>`;
  s+=`<polygon points="97,136 152,84 97,32 42,84" fill="#3d2408"/>`;
  s+=`<circle cx="97" cy="97" r="13" fill="none" stroke="#6b4a20" stroke-width="1.2" stroke-dasharray="3,2"/>`;
  const bp={home:[97,136],first:[152,84],second:[97,32],third:[42,84]};
  const rs=new Set(o.runners||[]);
  for(const[n,[x,y]] of Object.entries(bp)){
    if(n==='home'){s+=`<polygon points="${x},${y-6} ${x+6},${y} ${x},${y+4} ${x-6},${y}" fill="#d4c090" stroke="#8a7040" stroke-width="1.5"/>`;
    }else{const num=n==='first'?1:n==='second'?2:3;const on=rs.has(num);
      s+=`<rect x="${x-5}" y="${y-5}" width="10" height="10" rx="2" fill="${on?'#f97316':'#4a3210'}" stroke="${on?'#ea580c':'#7a5a30'}" stroke-width="1.5" transform="rotate(45,${x},${y})"/>`;
    }
  }
  s+=`<circle cx="97" cy="97" r="4" fill="#6b4a20" stroke="#8a6030" stroke-width="1"/>`;
  const fp={p:[97,97],c:[97,144],s1b:[148,96],s2b:[120,70],ss:[74,70],s3b:[46,96],lf:[38,44],cf:[97,16],rf:[156,44]};
  for(const[k,[fx,fy]] of Object.entries(fp)){
    if(o.anim&&(k===o.myPos||k==='p'))continue;
    const me=!o.anim&&o.myPos===k;
    if(me){
      s+=meRing(fx,fy,9,'#3d8ef0');
      s+=`<circle cx="${fx}" cy="${fy}" r="8" fill="#dbeafe" stroke="#3d8ef0" stroke-width="2"/>`;
      s+=`<text x="${fx}" y="${fy+2.5}" text-anchor="middle" font-size="5.5" font-weight="800" fill="#1a3a6b" font-family="Nunito,sans-serif">TY</text>`;
    }else{
      s+=`<circle cx="${fx}" cy="${fy}" r="4" fill="#2a4a1a" stroke="#4a7a4a" stroke-width="1.2"/>`;
      const l=k==='s1b'?'1B':k==='s2b'?'2B':k==='ss'?'SS':k==='s3b'?'3B':k.toUpperCase();
      s+=`<text x="${fx}" y="${fy+2}" text-anchor="middle" font-size="4" fill="#6ab06a" font-family="sans-serif">${l}</text>`;
    }
  }
  if(o.showBatter!==false){
    const me=!o.anim&&o.myPos==='bat';
    if(me){
      s+=meRing(109,139,8,'#f97316');
      s+=`<circle cx="109" cy="139" r="7" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>`;
      s+=`<text x="109" y="128" text-anchor="middle" font-size="6" font-weight="800" fill="#f97316" font-family="Nunito,sans-serif">TY</text>`;
    }else s+=`<circle cx="109" cy="139" r="4" fill="#3d2408" stroke="#7a5a30" stroke-width="1.2"/>`;
  }
  for(const[i,a] of (o.arrows||[]).entries()){
    const[x1,y1]=a.from,[x2,y2]=a.to,c=a.color||'#3d8ef0',delay=i*0.4;
    const id='qa'+Math.random().toString(36).slice(2,6);
    s+=`<defs><marker id="${id}" markerWidth="6" markerHeight="4" refX="4" refY="2" orient="auto"><polygon points="0 0,6 2,0 4" fill="${c}" opacity="0.4"/></marker></defs>`;
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="1.5" opacity="0.3" marker-end="url(#${id})"/>`;
    s+=travelToken(x1,y1,x2,y2,c,delay);s+=targetPulse(x2,y2,c,delay);
  }
  if(o.myRunner&&!o.anim){
    const rp={1:[152,84],2:[97,32],3:[42,84]};const[rx,ry]=rp[o.myRunner];
    s+=meRing(rx+8,ry-8,7,'#f97316');
    s+=`<circle cx="${rx+8}" cy="${ry-8}" r="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>`;
    s+=`<text x="${rx+8}" y="${ry-4}" text-anchor="middle" font-size="5" font-weight="800" fill="#f97316" font-family="sans-serif">TY</text>`;
  }
  if(o.anim){
    const a=o.anim,T=a.T||5,k=a.steps.length||1,tail=a.result?0.18:0.05,pl=(1-tail)/k,mv=0.65;
    const init=a.init||{},pos={},wp={};
    Object.keys(init).forEach(key=>{pos[key]=init[key].slice();wp[key]=[{t:0,x:pos[key][0],y:pos[key][1]}];});
    a.steps.forEach((moves,i)=>{
      const st=i*pl;moves.forEach(mo=>{
        const key=mo.m;
        if(!wp[key]){pos[key]=(mo.from||mo.to).slice();wp[key]=[{t:0,x:pos[key][0],y:pos[key][1]}];}
        const from=pos[key].slice();
        if(st>0.001)wp[key].push({t:st,x:from[0],y:from[1]});
        if(mo.via)wp[key].push({t:st+pl*mv*.5,x:mo.via[0],y:mo.via[1]});
        wp[key].push({t:st+pl*mv,x:mo.to[0],y:mo.to[1]});
        pos[key]=mo.to.slice();
      });
    });
    Object.keys(wp).forEach(key=>{wp[key].push({t:1,x:pos[key][0],y:pos[key][1]});});
    if(wp.ball)s+=actorAnim(BALL_ART,wp.ball,T);
    if(wp.hero)s+=actorAnim(heroArt(),wp.hero,T);
    if(a.result)s+=resultPop(a.result.at[0],a.result.at[1],a.result.c||'#3d8ef0',a.result.text,T);
  }
  s+=`</svg>`;return s;
}

let QST={};
function renderQuizStart(){
  const done=S.get('qz-'+today())||0;const p=getP();
  document.getElementById('page-quiz').innerHTML=`
    ${hippoMsg([`Kvíz čas, ${p.name}! 🧠`,`Správně = body (runs)!`],'think')}

      <div class="scard"><div class="scard-val" style="color:var(--org)">${p.runs||0}</div><div class="scard-lbl">Body celkem</div></div>
      <div class="scard"><div class="scard-val" style="color:var(--green)">${QQ.length}</div><div class="scard-lbl">Otázek</div></div>
    </div>
    <button class="btn btn-p btn-w" onclick="startQuiz('all')" style="margin-bottom:8px;font-size:.95rem">▶ Spustit kvíz (10 otázek)</button>
    <button class="btn btn-ghost btn-w" onclick="startQuiz('r1')" style="margin-bottom:16px;font-size:.88rem">🎲 Jedna náhodná otázka</button>
    <div class="stitle">Procvič si téma</div>
    <div class="quiz-cats">
      ${[['obrana','🧤','Obrana'],['pálení','🏏','Pálení'],['běh','🏃','Běh'],['pravidla','📋','Pravidla']]
        .map(([c,ic,n])=>`<div class="qcat" onclick="startQuiz('${c}')">
          <div class="qcat-ic">${ic}</div>
          <div class="qcat-n">${n}</div>
          <div class="qcat-c">${QQ.filter(q=>q.cat===c).length} otázek</div>
        </div>`).join('')}
    </div>`;
}
function startQuiz(mode){
  let pool=[];
  if(mode==='all')pool=shuf([...QQ]).slice(0,10);
  else if(mode==='r1')pool=shuf([...QQ]).slice(0,1);
  else pool=shuf(QQ.filter(q=>q.cat===mode)).slice(0,8);
  QST={pool,idx:0,lives:3,score:0,streak:0};
  renderQ();speak(pool[0].q);
}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderQ(){
  if(QST.idx>=QST.pool.length){endQuiz();return}
  const q=QST.pool[QST.idx],prog=Math.round((QST.idx/QST.pool.length)*100);
  const isFC=q.type==='fc';
  let opts='';
  if(!isFC)opts=`<div class="mc-opts">${q.opts.map((o,i)=>`<button class="mc-o" id="qo${i}" onclick="ansMC(${i})">${o}</button>`).join('')}</div>`;
  else opts=`<button class="fc-rev" onclick="fcRev()">👁 Zobrazit odpověď</button>
    <div class="fc-ans" id="fca">${q.ans}</div>
    <div class="fc-rate" id="fcr"><button class="fcr-btn fcr-yes" onclick="fcRate(true)">✓ Věděl jsem!</button><button class="fcr-btn fcr-no" onclick="fcRate(false)">✗ Nevěděl</button></div>`;
  document.getElementById('page-quiz').innerHTML=`
    ${hippoMsg([q.q],'think')}
    <div class="qz-top">
      <div class="qz-hearts">${[0,1,2].map(i=>`<span style="opacity:${i>=QST.lives?.25:1}">❤️</span>`).join('')}</div>
      <div class="qz-pw"><div class="qz-pbar"><div class="qz-pfill" style="width:${prog}%"></div></div>
        <div class="qz-plbl">${QST.idx+1} / ${QST.pool.length}</div></div>
      ${QST.streak>=2?`<div class="qz-streak">🔥 ${QST.streak}×</div>`:''}
    </div>
    <div class="qcard">
      <div class="qcard-type">${isFC?'Přemysli a odpověz':'Vyber správnou odpověď'}</div>
      <div class="qcard-q">${q.q}</div>
      ${q.term?`<div class="qcard-term">${q.term}</div>`:''}
      ${q.diag?`<div class="qcard-diag">${q.diag}</div>`:''}
      ${opts}
      <div class="qz-fb" id="qfb"></div>
      <div class="qz-xp" id="qxp"></div>
    </div>
    <button class="btn btn-p btn-w" id="qnxt" style="display:none" onclick="nextQ()">Další → 🦛</button>
    <button class="btn btn-ghost btn-w" style="margin-top:7px;font-size:.78rem;color:var(--text3)" onclick="renderQuizStart()">✕ Ukončit</button>`;
}
function ansMC(i){
  const q=QST.pool[QST.idx],ok=i===q.ans;
  document.querySelectorAll('.mc-o').forEach(b=>b.disabled=true);
  document.getElementById('qo'+q.ans).classList.add('correct');
  if(!ok){document.getElementById('qo'+i).classList.add('wrong');
    QST.lives--;QST.streak=0;sndWrong();
    if(QST.lives<=0){setTimeout(endQuiz,1200);return}
  }else{QST.score++;QST.streak++;sndCorrect();showXP('+1 run'+(QST.streak>=3?' 🔥':''));}
  showFB(ok,q.exp);document.getElementById('qnxt').style.display='flex';logQ(ok);
}
function fcRev(){
  document.getElementById('fca').classList.add('show');
  document.querySelector('.fc-rev').style.display='none';
  document.getElementById('fcr').style.display='flex';
}
function fcRate(knew){
  if(knew){QST.score++;QST.streak++;sndCorrect();showXP('+1 run');}else{QST.streak=0;sndWrong();}
  document.getElementById('fcr').style.display='none';
  showFB(knew,QST.pool[QST.idx].exp);document.getElementById('qnxt').style.display='flex';logQ(knew);
}
function showFB(ok,txt){
  const msgs=ok?HIPPO_MESSAGES.quizCorrect():HIPPO_MESSAGES.quizWrong();
  const el=document.getElementById('qfb');
  el.className='qz-fb show '+(ok?'ok':'err');
  el.innerHTML=`<strong>${msgs[0]}</strong> ${txt}`;
}
function showXP(txt){const el=document.getElementById('qxp');if(el){el.textContent=txt;el.classList.add('show');}}
function nextQ(){speak(QST.pool[QST.idx+1]?.q||'');QST.idx++;renderQ();}
function logQ(ok){
  if(ok)addRuns(1);
  const d=today();S.set('qz-'+d,(S.get('qz-'+d)||0)+1);
  // Mark theory task done when 3+ quiz questions answered
  if((S.get('qz-'+d)||0)>=3){
    const d2=getDone();if(!d2['q-theory']){
      d2['q-theory']=true;S.set('done-'+today(),d2);
    }
  }
}
function endQuiz(){
  sndComplete();if(QST.score>=5)confetti();recordDay();
  const pct=Math.round((QST.score/QST.pool.length)*100);
  let em='⭐',title='Dobrá práce!',sub='Pokračuj dál!';
  if(pct>=90){em='🏆';title='Perfektní!';sub='Jsi opravdový hráč!';}
  else if(pct>=70){em='🎉';title='Super výkon!';sub='Skoro perfektní!';}
  document.getElementById('page-quiz').innerHTML=`
    ${hippoMsg(HIPPO_MESSAGES[pct>=70?'quizCorrect':'quizWrong'](),'cheer')}
    <div class="qz-end">
      <span class="qe-em">${em}</span>
      <div class="qe-t">${title}</div>
      <div class="qe-s">${sub}</div>
      <div class="qe-score">+${QST.score} bodů!</div>
      <div style="display:flex;gap:9px;justify-content:center">
        <button class="btn btn-p" onclick="startQuiz('all')">🔄 Znovu</button>
        <button class="btn btn-ghost" onclick="renderQuizStart()">← Menu</button>
      </div>
    </div>`;
}

function renderActivity(){
  const done=getDone();
  const tasks=getTodayTasks();
  const todayPhys=tasks.find(t=>['athletic','throwing','batting','catching'].includes(t.type));
  let html=`${hippoMsg(['Čas na cvičení! 💪','Vyber co chceš dělat.'],'cool')}`;
  if(todayPhys){
    html+=`<div class="stitle" style="color:var(--hippos)">⭐ Dnešní doporučení</div>`;
    const match=ACTS.find(a=>a.id.includes(todayPhys.type.replace('athletic','agility').replace('throwing','throw').replace('batting','bat').replace('catching','catch')))||ACTS[0];
    html+=renderActCard(match,done,true);
  }
  html+=`<div class="stitle">Všechna cvičení</div>`;
  ACTS.forEach(act=>{ html+=renderActCard(act,done,false); });
  document.getElementById('page-activity').innerHTML=html;
}
function renderActCard(act,done,highlight){
  const isDone=done[act.id];
  return `<div class="act-card${isDone?' completed':''}" style="${highlight?'border-color:var(--hippos);':''}" id="ac-${act.id}">
    <div class="act-head" onclick="togAct('${act.id}')">
      <div class="act-em">${act.emoji}</div>
      <div class="act-info">
        <div class="act-title">${act.title}${highlight?' ⭐':''}</div>
        <div class="act-desc">${act.desc}</div>
      </div>
      <div class="act-xp">+${act.xp} bodů</div>
      <div class="act-tog" id="at-${act.id}">▾</div>
    </div>
    <div class="act-body" id="ab-${act.id}">
      <div class="act-steps">
        ${act.steps.map(s=>`<div class="astep"><div class="asn">${s.n}</div>
          <div class="astxt"><strong>${s.t}</strong><br>${s.txt}</div></div>`).join('')}
      </div>
      ${!isDone?`<button class="act-done" onclick="completeAct('${act.id}',${act.xp})">✅ Hotovo! +${act.xp} bodů</button>`
        :`<div style="text-align:center;padding:8px 15px 15px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;color:var(--green)">✓ Dnes splněno! 🎉</div>`}
    </div>
  </div>`;
}
function togAct(id){
  const body=document.getElementById('ab-'+id);
  const tog=document.getElementById('at-'+id);
  body.classList.toggle('show');tog.classList.toggle('open');
  sndTap();
  if(body.classList.contains('show')){
    const act=ACTS.find(a=>a.id===id);
    if(act)speak(act.title+'. '+act.steps[0].t+'. '+act.steps[0].txt);
  }
}
function completeAct(id,xp){
  const done=getDone();done[id]=true;S.set('done-'+today(),done);
  addRuns(xp);sndComplete();confetti();
  renderActivity();renderHome();
}

function renderBasics(){

  h+=lv1.map(b=>bcCard(b)).join('');
  h+=`<div class="stitle">Techniky – jak se zlepšit</div>`;
  h+=lv2.map(b=>bcCard(b)).join('');
  document.getElementById('page-basics').innerHTML=h;

function bcCard(b){
  const i=BASICS.indexOf(b);
  return `<div class="bc-card" onclick="bcTog(${i})">
    <div class="bc-head">
      <div class="bc-em" style="background:${b.bg}">${b.em}</div>
      <div class="bc-inf"><div class="bc-t">${b.t}</div><div class="bc-s">${b.s}</div></div>
      <span class="bc-lv lv${b.lv}">${b.lv===1?'Základy':'Techniky'}</span>
      <span class="bc-arr" id="ba-${i}">▾</span>
    </div>
    <div class="bc-body" id="bb-${i}"><div class="bc-inner">${b.b}</div></div>
  </div>`;
}
function bcTog(i){
  document.getElementById('bb-'+i).classList.toggle('show');
  document.getElementById('ba-'+i).classList.toggle('open');
  sndTap();
  speak(BASICS[i].t+'. '+BASICS[i].s);
}
